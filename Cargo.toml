[workspace]
resolver = "2"
members = ["crates/schema"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pat/die_pcloud"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = "12.0"

[profile.release]
lto = "thin"
codegen-units = 1
